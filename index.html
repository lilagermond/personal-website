<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Lila GERMOND - Chef de projet informatique</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<!-- Header -->
		<header>
			<div id="main-nav">
				<img id="logo" src="images/logo.png" alt="Retourner à la page d'accueil" />
				
				<!-- Bouton burger -->
				<button id="burger" aria-label="Ouvrir le menu" aria-expanded="false">
					<span></span>
					<span></span>
					<span></span>
				</button>
				
				<div id="nav">
					<a href="#experiences">Mon expérience</a>
					<a href="#education">Ma formation</a>
					<a href="#project-management-skills">Mes compétences</a>
					<a href="#contact">Me contacter</a>
				</div>
			</div>
		</header>

		<!-- Présentation -->
		<div id="fullscreen">
			<h1 id="header-name"></h1>
			<p id="header-title"></p>
		</div>

		<section id="introduction">
			<div class="container" id="introduction-content"></div>
		</section>

		<!-- Expériences professionnelles -->
		<section id="experiences">
			<h2>Mes expériences professionnelles</h2>
			<div id="experiences-list" class="container"></div>
		</section>

		<!-- Formation -->
		<section id="education">
			<h2>Ma formation</h2>
			<div id="education-list" class="container"></div>
		</section>

		<!-- Compétences en gestion de projet -->
		<section id="project-management-skills">
			<h2>Mes compétences en gestion de projet</h2>
			<div id="project-management-skills-list" class="container"></div>
		</section>

		<!-- Compétences complémentaires -->
		<section id="other-skills">
			<h2>Mes compétences complémentaires</h2>
			<div id="other-skills-list" class="container"></div>
		</section>

		<!-- Outils utilisés -->
		<section id="tools">
			<h2>Outils utilisés</h2>
			<div id="tools-list" class="container"></div>
		</section>


		<!-- Contact -->
		<section id="contact" class="grey">
			<h2>Me contacter</h2>
			<div id="contact-list" class="container"></div>
		</section>

		<!-- Footer -->
		<footer id="footer">
			<p> © <span id="copyright"></span> <span id="copyright-year"></span></p>
			<p id="credits"></p>
		</footer>

		<script type="text/javascript" src="js/script.js"></script>
	</body>
</html>
